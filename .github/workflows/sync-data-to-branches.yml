name: Sync Data to Feature Branches

# WHY THIS EXISTS
# ---------------
# `refresh-market-data.yml` and `refresh-earnings-calendar.yml` both check out
# the default branch, commit the refreshed src/data/*.json snapshot, and push —
# to `master` only. A long-lived feature branch therefore keeps whatever data
# baseline it forked with, and that baseline is what every YTD column and every
# pre-live-overlay render falls back to. On 2026-08-05 that surfaced as a
# feature branch showing "21-July" dates everywhere while the refresh pipelines
# were running green: not an ingestion failure at all, just branch drift.
#
# This workflow closes that gap: whenever a data refresh lands on master, the
# same commit is merged into every participating `feat/**` branch.
#
# WHY IT TRIGGERS ON `workflow_run` AND NOT ON THE PUSH ITSELF
# ------------------------------------------------------------
# The obvious trigger — `push: branches: [master], paths: ['src/data/**']` —
# reads correctly and never fires. Both refresh workflows push using
# `secrets.GITHUB_TOKEN`, and GitHub deliberately raises no workflow-triggering
# event for a push authored by that token; that is the platform's anti-recursion
# rule, not a bug in the path filter. Measured 2026-08-28: 51 bot data-refresh
# commits landed on master between 2026-08-06 and 2026-08-28, and this workflow
# ran exactly ONCE in its entire lifetime — on 2026-08-05, from the human push
# that added the file.
#
# `workflow_run` keys off the *completion of a workflow run* rather than off a
# git push event, so the GITHUB_TOKEN restriction does not apply to it. It needs
# no PAT, no GitHub App, and no new repository secret. (`workflow_run` only ever
# runs the copy of this file that is on the default branch — `master` here.)
#
# The `push` trigger is KEPT as a secondary path: a human committing data to
# master directly is a real event that should still sync.
#
# SAFETY RULES (deliberately conservative — an Action must not make integration
# decisions on a human's behalf):
#   * It merges ONLY when everything master would bring in lives under
#     src/data/. The moment master carries a source change the branch lacks,
#     that branch is skipped with a warning — merging code is a human call.
#   * A merge that conflicts is aborted and the branch is left exactly as it
#     was. Nothing is ever force-pushed and no branch is ever rewritten.
#   * Only branches under SYNC_BRANCH_GLOB that are still being worked on take
#     part; parked branches are reported, not quietly rewritten.
#   * It cannot loop: it is not in its own `workflows:` list, it never pushes to
#     master, and its own pushes use GITHUB_TOKEN (which triggers nothing).

on:
  workflow_run:
    workflows:
      - 'Refresh Market Data'
      - 'Refresh Earnings Calendar'
    types: [completed]
  push:
    branches: [master]
    paths:
      - 'src/data/**'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest

    # Sync only after a refresh that actually SUCCEEDED, and only for a refresh
    # that ran on master. A failed or cancelled refresh has nothing to
    # propagate, and a refresh dispatched by hand from a feature branch must not
    # push master's state around on that branch's behalf.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')

    permissions:
      contents: write

    env:
      # Which branches take part. Scoped on purpose — this is not "every ref".
      SYNC_BRANCH_GLOB: 'refs/remotes/origin/feat/**'
      # A branch with no commit in this many days is treated as parked: reported
      # in the summary, never merged into. Keeps abandoned work from collecting
      # merge commits, without needing a hand-maintained branch list that
      # everyone forgets to update — which is how the original drift happened.
      SYNC_MAX_BRANCH_AGE_DAYS: '30'

    steps:
      - name: Checkout (full history — merges need every branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge refreshed data into each feature branch
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune

          echo "## Data sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Triggered by \`$GITHUB_EVENT_NAME\`." >> "$GITHUB_STEP_SUMMARY"

          BRANCHES=$(git for-each-ref --format='%(refname:strip=3)' "$SYNC_BRANCH_GLOB")

          if [ -z "$BRANCHES" ]; then
            echo "No branches match $SYNC_BRANCH_GLOB — nothing to sync."
            echo "No participating branches to sync." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CUTOFF=$(( $(date +%s) - SYNC_MAX_BRANCH_AGE_DAYS * 86400 ))

          for BRANCH in $BRANCHES; do
            echo "::group::$BRANCH"

            if git merge-base --is-ancestor origin/master "origin/$BRANCH"; then
              echo "Already contains master — nothing to do."
              echo "- \`$BRANCH\` — already up to date" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            # Parked branches are left alone. Merging refreshed data into work
            # nobody is touching only adds noise to a branch a human will have
            # to reconcile by hand anyway.
            TIP_TS=$(git log -1 --format=%ct "origin/$BRANCH")
            if [ "$TIP_TS" -lt "$CUTOFF" ]; then
              LAST=$(git log -1 --format=%as "origin/$BRANCH")
              echo "Last commit $LAST is older than ${SYNC_MAX_BRANCH_AGE_DAYS}d — parked, skipping."
              echo "- \`$BRANCH\` — skipped: parked since $LAST" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            BASE=$(git merge-base origin/master "origin/$BRANCH")
            INCOMING=$(git diff --name-only "$BASE" origin/master)

            # Anything outside src/data/ means master carries source changes this
            # branch has not integrated. Skip loudly rather than merge code.
            if echo "$INCOMING" | grep -qv '^src/data/'; then
              echo "master carries non-data changes — skipping (needs a human merge):"
              echo "$INCOMING" | grep -v '^src/data/' | head -20
              echo "- \`$BRANCH\` — **skipped**: master has source changes; merge it yourself" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            git checkout -B "$BRANCH" "origin/$BRANCH"

            if git merge origin/master --no-ff -m "chore(data): sync refreshed market data from master"; then
              git push origin "$BRANCH"
              echo "Merged and pushed."
              echo "- \`$BRANCH\` — synced" >> "$GITHUB_STEP_SUMMARY"
            else
              git merge --abort || true
              echo "::warning title=Data sync conflict::$BRANCH conflicts with master's data refresh; left untouched."
              echo "- \`$BRANCH\` — **conflict**, left untouched" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "::endgroup::"
          done
